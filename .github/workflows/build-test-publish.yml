name: build-test-publish

on:
  push:
    branches: [master]
    # date versions, e.g. 2026-11-07
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and smoke test image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: it-tools:test
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Serves the app with the headers the WebAssembly tools need
        run: |
          docker run -d --name it-tools-test -p 8080:8080 it-tools:test
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

          curl -sfD "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/index.html" http://localhost:8080/
          grep -qi '^cross-origin-opener-policy: same-origin' "$RUNNER_TEMP/headers"
          grep -qi '^cross-origin-embedder-policy: require-corp' "$RUNNER_TEMP/headers"
          grep -q '<base href="/">' "$RUNNER_TEMP/index.html"

          # deep links fall back to the SPA instead of 404
          curl -sf -o /dev/null http://localhost:8080/uuid-generator

      - name: Serves the app from a subfolder with BASE_URL
        run: |
          docker run -d --name it-tools-subfolder -e BASE_URL=/it-tools/ -p 8081:8080 it-tools:test
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8081/it-tools/ && break
            sleep 1
          done

          curl -sf http://localhost:8081/it-tools/ | grep -q '<base href="/it-tools/">'
          curl -sf -o /dev/null http://localhost:8081/it-tools/uuid-generator

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs it-tools-test || true
          docker logs it-tools-subfolder || true

      - name: Remove test containers
        if: always()
        run: docker rm -f it-tools-test it-tools-subfolder || true

  publish:
    name: Publish multi-arch image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/it-tools
          tags: |
            # git tag 2026-11-07 -> image tag 2026-11-07
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # always rebuild from the latest base so apk upgrade picks up security fixes
          pull: true
          no-cache: true
