<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f1eee3" />
    <style>
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      :root { --it-primary: #4b5a50; }
      :root.dark { --it-primary: #a9baae; }
      html, body { background-color: #f1eee3; }
      html.dark, html.dark body { background-color: #252c28; }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('vueuse-color-scheme') || 'auto';
          if (mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#252c28');
          }
        }
        catch (e) {}
      })();
    </script>
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
